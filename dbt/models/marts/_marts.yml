version: 2
models:
  - name: dim_date
    description: >
      One row per day, contiguous from 1 January of the earliest observation year
      to 31 December of the latest across Eurostat and Regionalstatistik, so Power BI
      can mark it as a date table.
    columns:
      - name: date_key
        description: YYYYMMDD as an integer.
        data_tests: [unique, not_null]
      - name: full_date
        data_tests: [unique, not_null]
      - name: month_start_date
        data_tests: [not_null]
      - name: is_month_start
        data_tests: [not_null]

  - name: dim_geo
    columns:
      - name: geo_key
        data_tests: [unique, not_null]
      - name: geo_code
        data_tests: [unique, not_null]
      - name: is_aggregate
        description: True for Eurostat multi-country aggregates (EA21, EU27_2020 ...).
        data_tests: [not_null]

  - name: dim_series
    description: One row per indicator, unit, adjustment and breakdown.
    columns:
      - name: series_key
        data_tests: [unique, not_null]
      - name: indicator_label
        data_tests: [not_null]
      - name: unit_short_label
        description: Short unit for axes and tooltips (e.g. "% y/y"); falls back to the full label, then the code.
        data_tests: [not_null]
      - name: breakdown_code
        description: All breakdown dimensions packed as dim=code|dim=code, alphabetical. Kept for existing visuals; the split columns below agree with it.
      - name: age_code
        description: Age group. Null where the dataset does not break down by age.
      - name: age_label
      - name: sex_code
        description: Sex. Null where the dataset does not break down by sex.
      - name: sex_label
      - name: coicop18_code
        description: HICP item (ECOICOP ver.2). Null where the dataset does not break down by coicop18.
      - name: coicop18_label
      - name: nace_r2_code
        description: Economic activity (NACE Rev.2). Null where the dataset does not break down by nace_r2.
      - name: nace_r2_label
      - name: indic_code
        description: Business and consumer survey question. Null where the dataset does not break down by indic.
      - name: indic_label
      - name: indic_bt_code
        description: Short-term business statistic (production, sales volume, turnover). Null where the dataset does not break down by indic_bt.
      - name: indic_bt_label
      - name: series_label
        description: Every part spelled out, for tooltips.
        data_tests: [not_null]
      - name: short_label
        description: Indicator plus only the parts (breakdowns, unit, adjustment) that vary within the dataset, for slicers and legends.
        data_tests: [unique, not_null]
      - name: is_headline
        data_tests: [not_null]
      - name: aggregation
        description: How values may be combined across geos, breakdowns or months. none = do not sum or average.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [none, sum]
      - name: aggregation_short
        description: The aggregation rule as a report-table heading. Capped at 45 characters so the reasoning stays in aggregation_description.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null and length(aggregation_short) <= 45"
      - name: aggregation_description
        data_tests: [not_null]
      - name: varies_in
        description: >
          How the series relates to its dataset's headline, comparing unit, s_adj and every
          breakdown dimension. 'headline' when all match, the one differing dimension's name
          (e.g. 'age') when exactly one differs, null when two or more do. Filter to
          varies_in in ('headline', 'age') to get a clean single-dimension breakdown.
        data_tests:
          - accepted_values:
              arguments:
                values: [headline, unit, s_adj, age, sex, coicop18, nace_r2, indic, indic_bt]
      - name: varies_in_label
        description: varies_in for display; null exactly when varies_in is.
        data_tests:
          - not_null:
              config:
                where: "varies_in is not null"

  - name: fct_observation
    description: One row per series, geo and month.
    columns:
      - name: series_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_key
      - name: geo_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: status
        description: Eurostat observation flag; null when unflagged.
      - name: status_label
        description: What the flag means, e.g. provisional or break in time series.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_key, geo_key, date_key]
