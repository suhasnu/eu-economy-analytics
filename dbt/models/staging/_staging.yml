version: 2
models:
  - name: stg_eurostat__observations
    description: All five datasets in one long table, one row per series, geo and month.
    columns:
      - name: dataset_name
        data_tests: [not_null]
      - name: geo_code
        data_tests: [not_null]
      - name: period_date
        description: First day of the observation month.
        data_tests: [not_null]
      - name: unit_code
        data_tests: [not_null]
      - name: adjustment_code
        data_tests: [not_null]
      - name: breakdown_code
        data_tests: [not_null]
      - name: status
        description: Eurostat observation flag; null when unflagged. Labels are in eurostat_code_labels under dimension status.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [dataset_name, unit_code, adjustment_code, breakdown_code, geo_code, period_date]

  - name: stg_regionalstatistik__observations
    description: >
      Regionalstatistik table 13211-02-05-4-B, one row per region level, region, series and year,
      as published at each level.
    columns:
      - name: region_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [national, land, kreis]
      - name: region_code
        description: DG, a 2-digit Land key or a 5-digit district key. Leading zeros kept.
        data_tests: [not_null]
      - name: year
        data_tests: [not_null]
      - name: series_code
        description: value_variable_code, joined with the breakdown code when there is one (ERWP06.ARBEITSLOS05).
        data_tests: [not_null]
      - name: status
        description: "- code does not exist that year, . unknown or withheld, x blocked as not meaningful. Null when a value is published."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [region_level, region_code, series_code, year]
